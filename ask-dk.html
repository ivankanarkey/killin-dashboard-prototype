<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask DK</title>
<style>
:root{color-scheme:dark;--bg:#020a14;--glow:#0a2744;--pan:#061a33;--pan-lt:#0b2d52;--blue:#1e88e5;--hd:#5fb3ff;--ink:#fff;--muted:#bcd4f0;--back:#ffe600;--pur:#d400ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(ellipse 90% 60% at 50% 0%,var(--glow),var(--bg) 70%) fixed;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:28px;font-weight:900;color:var(--hd);text-shadow:0 0 12px rgba(30,136,229,.9);line-height:1.15}
.back{min-height:48px;min-width:48px;padding:0 22px;border-radius:12px;background:var(--back);color:#000;font-weight:900;font-size:18px;border:3px solid #fff59d;box-shadow:0 0 10px var(--back),0 0 22px var(--back);flex:none}
/* person tabs: phone portrait only */
.tabs{display:none;gap:8px;margin-bottom:12px}
.tab{flex:1;min-height:48px;border-radius:12px;background:var(--pan);border:2px solid var(--blue);color:var(--hd);font-weight:800;font-size:17px}
.tab.on{background:var(--pan-lt);color:var(--ink);border-color:#90caff;box-shadow:0 0 12px rgba(30,136,229,.8)}
/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.col{background:linear-gradient(180deg,#0b2d52,#061a33);border:3px solid var(--blue);border-radius:16px;box-shadow:0 0 16px rgba(30,136,229,.45);padding:12px;min-height:200px}
.colh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.colh b{font-size:22px;font-weight:900;color:var(--hd)}
.colh span{font-size:16px;color:var(--muted);font-weight:700}
.card{display:block;width:100%;text-align:left;background:var(--pan);border:2px solid var(--blue);border-left:8px solid var(--pur);border-radius:12px;padding:12px;margin-bottom:10px;min-height:48px}
.card .ask{font-size:17px;font-weight:800;line-height:1.3}
.card .meta{font-size:15px;color:var(--muted);margin-top:6px}
.empty{font-size:16px;color:var(--muted);padding:8px 2px}
/* detail */
#detail{display:none}
.part{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{min-height:36px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--pan-lt);border:2px solid #90caff;font-weight:800;font-size:16px}
.f{background:var(--pan);border:2px solid var(--blue);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.f label{display:block;font-size:15px;font-weight:900;color:var(--hd);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.f p{font-size:17px;line-height:1.45;white-space:pre-line}
.f p.none{color:var(--muted)}
.f.ask{border-left:8px solid var(--pur)}
.f.ask p{font-size:19px;font-weight:800}
.lbl{font-size:16px;color:var(--muted);font-weight:700}
footer{margin-top:22px;font-size:14px;color:var(--muted);line-height:1.45}
@media (max-width:760px) and (orientation:portrait){
 .tabs{display:flex}
 .board{display:block}
 .col{display:none}
 .col.on{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="title">Ask DK</h1><button class="back" id="back">Back</button></div>

  <section id="boardView">
    <div class="tabs" id="tabs"></div>
    <div class="board" id="board"></div>
  </section>
</div>

<script src="ask-dk-data.js"></script>
<script>
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab=0;

function board(){
 document.getElementById('title').textContent='Ask DK';
 document.getElementById('boardView').style.display='';
 document.getElementById('tabs').innerHTML=PEOPLE.map((p,i)=>'<button class="tab'+(i===tab?' on':'')+'" data-t="'+i+'">'+p+' · '+ASKS.filter(a=>a.from===p).length+'</button>').join('');
 document.getElementById('board').innerHTML=PEOPLE.map((p,i)=>{
  const L=ASKS.map((a,ix)=>[a,ix]).filter(x=>x[0].from===p);
  return '<div class="col'+(i===tab?' on':'')+'"><div class="colh"><b>'+p+'</b><span>'+L.length+(L.length===1?' ask':' asks')+'</span></div>'+
   (L.length?L.map(([a,ix])=>'<button class="card" data-a="'+ix+'"><div class="ask">'+esc(a.ask)+'</div>'+(a.when?'<div class="meta">'+esc(a.when)+'</div>':'')+'</button>').join(''):'<div class="empty">No asks yet.</div>')+'</div>'}).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;board()});
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{location.href='ask-dk-template.html?a='+c.dataset.a});
 document.getElementById('back').onclick=()=>{location.href='dashboard-prototype.html'};
}

board();
</script>
</body>
</html>
